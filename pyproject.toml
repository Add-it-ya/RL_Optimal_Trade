[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-optimal-execution"
version = "0.2.0"
description = "Reinforcement learning for optimal trade execution on a Brownian limit-order-book simulator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RL Execution Team" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
rl = ["torch>=2.0", "stable-baselines3>=2.2.1", "tensorboard>=2.13"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pin the style/type tools exactly so CI reproduces local results (their output
    # changes between releases). Bump deliberately, alongside a reformat if needed.
    "ruff==0.15.18",
    "black==24.8.0",
    "mypy==1.11.2",
    "pre-commit>=3.5",
]

[project.scripts]
rlx = "rl_execution.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_execution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end runs that train an agent (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length is owned by the formatter (black)

[tool.ruff.lint.per-file-ignores]
# The package sets KMP_DUPLICATE_LIB_OK before importing submodules, so imports are
# intentionally not all at the top of the file.
"rl_execution/__init__.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true       # torch / sb3 / gymnasium ship partial stubs
disallow_untyped_defs = false       # start lenient; tighten module-by-module in later steps
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/"]

# Don't descend into heavy third-party sources (most ship no/partial stubs); treat them as
# untyped at our boundary instead.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "stable_baselines3.*",
    "gymnasium.*",
    "pandas.*",
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "tqdm.*",
    "yaml",
]
follow_imports = "skip"
ignore_missing_imports = true

# Plotting/visualisation is deferred from strict typing (least valuable to annotate and
# heavily matplotlib-driven); tightened opportunistically in a later step.
[[tool.mypy.overrides]]
module = ["rl_execution.viz.*"]
ignore_errors = true

[tool.coverage.run]
source = ["rl_execution"]
omit = ["*/viz/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:"]
